name: my_ringtone_player
description: A local plugin to play custom ringtones in the background.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dgdevhub.charge_mate.my_ringtone_player
        pluginClass: MyRingtonePlayerPlugin
